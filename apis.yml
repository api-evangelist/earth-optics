aid: earth-optics
name: EarthOptics
description: 'EarthOptics is a soil data measurement and mapping company headquartered
  in Minneapolis, Minnesota. It combines proprietary in-field proximal sensing hardware,
  robotics, genomics and laboratory testing with machine learning models to produce
  high-resolution sub-field maps of soil compaction, fertility and nutrients, soil
  biology, moisture and soil organic carbon from far fewer physical samples than conventional
  soil testing. The company sells measurement and analytics, agronomic planning (crop
  planning, nutrient management, sub-field scripting) and carbon planning (carbon credit
  planning, sustainability-as-a-service, 45Z clean-fuel documentation) to farmers,
  agronomists and consultants, ranchers and landowners, seed suppliers, ag retail,
  carbon project developers and corporate sustainability teams. Results are delivered
  through the 360 PRO customer dashboard at app.earthoptics.com and through a dealer
  network. EarthOptics merged with soil-biology company Pattern Ag and reports having
  mapped more than five million acres. It operates a customer-facing web application
  backed by a private REST API, but publishes no public developer program, API documentation
  or SDKs.'
