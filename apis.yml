apis:
- aid: earth-optics-platform-api
  name: EarthOptics Platform API
  description: 'Private REST API backing the EarthOptics customer application (360
    PRO dashboard) at app.earthoptics.com. Served from api.earthoptics.com on gunicorn
    behind Django REST Framework, with a drf-spectacular OpenAPI schema endpoint at
    /api/schema/ and a Swagger UI at /api/docs/. Both the schema and the interactive
    docs require a Bearer token (WWW-Authenticate: Bearer realm="api"), so the machine-readable
    contract exists but is not publicly retrievable. EarthOptics publishes no public
    developer portal, API reference, SDKs or self-serve API signup.'
