scope_note: 'EarthOptics publishes no OpenAPI (the drf-spectacular schema at /api/schema/
  is Bearer-gated) and no error reference. This catalog contains ONLY error responses
  observed verbatim from the live API against unauthenticated requests. It is deliberately
  short: authenticated 4xx/5xx classes cannot be enumerated without credentials, and
  none are invented here.'
envelope:
  detail: string — human-readable message (always present)
  code: string — machine-readable code (present on token errors)
  messages: array of objects — per-token diagnostics, SimpleJWT only
